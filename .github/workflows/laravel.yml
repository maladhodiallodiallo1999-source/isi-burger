name: ISI Burger CI/CD

on:
  push:
    branches:
      - diallo_thierno_burger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pull du code depuis GitHub
        uses: actions/checkout@v4

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Installation des dépendances Laravel
        run: composer install --no-interaction --optimize-autoloader --no-dev

      - name: Copier le fichier .env
        run: cp .env.example .env

      - name: Générer la clé Laravel
        run: php artisan key:generate

      - name: Construction de l'image Docker
        run: docker build -t isi-burger .

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push de l'image sur Docker Hub
        run: |
          docker tag isi-burger thiernomaladho224/isi-burger:latest
          docker push thiernomaladho224/isi-burger:latest
